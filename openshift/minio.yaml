apiVersion: v1
kind: Secret
metadata:
  name: minio-env
  namespace: reviewiq
stringData:
  config.env: |
    export MINIO_ROOT_USER=minioadmin
    export MINIO_ROOT_PASSWORD=minioadmin123
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: reviewiq
spec:
  configuration:
    name: minio-env
  requestAutoCert: false        # plain HTTP inside the cluster — simplest for the lab
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
